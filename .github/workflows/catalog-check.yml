name: Drivercatalogus controleren
on:
  push:
    paths:
      - 'catalog/**'
      - 'tests/**'
      - '.github/workflows/catalog-check.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'tests/**'
      - '.github/workflows/catalog-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/validate_catalog.py
