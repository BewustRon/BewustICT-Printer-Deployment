name: HP official DCU UI open original OEM CFG (isolated)
on:
  push:
    branches:
      - fix/hp-upd-device-capabilities-offline-20261113
    paths:
      - .github/workflows/hp-dcu-ui-open-cfg.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Open signed OEM HP configuration through GUI automation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          $src=@(
            @{name='park';url='https://ftp.hp.com/pub/softlib/software13/printers/UPD/HP-PARK-v1.9.2.zip';sha='29D5FF4DDCD1F2D200DDDC3334F5AE0B6B1F2CECB508CA75CB1C7AFCE120766B'},
            @{name='upd';url='https://ftp.hp.com/pub/softlib/software13/printers/UPD/upd-pcl6-win11-x64-8.2.0.26819.zip';sha='EDBACBBB0124FF5EF320C4023D7B540C8435263B37BA06812AB63DA2919534A2'}
          )
          foreach($s in $src){
             $zip=Join-Path $env:RUNNER_TEMP ($s.name+'.zip')
             & "$env:WINDIR\System32\curl.exe" --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 100 --output $zip $s.url
             if($LASTEXITCODE -ne 0){throw ('DOWNLOAD_'+$s.name+'_FAILED')}
             if((Get-FileHash $zip -Algorithm SHA256).Hash -ne $s.sha){throw ('HASH_'+$s.name+'_MISMATCH')}
             [IO.Compression.ZipFile]::ExtractToDirectory($zip,(Join-Path $env:RUNNER_TEMP $s.name))
          }
          $exe=Join-Path $env:RUNNER_TEMP 'park\driver configuration utility\hpbcfgap.exe'
          $cfg=Join-Path $env:RUNNER_TEMP 'upd\hpcpu360.cfg'
          $profile=[IO.File]::ReadAllText($cfg)
          foreach($item in @(
            @{Name='DynamicRender';Before='AUTODEVICE';After='COLORDEVICE'},
            @{Name='Tray3_install';Before='NotInstalled';After='Installed'}
          )){
            $pattern='(?s)(<feature\s+[^>]*>\s*'+[regex]::Escape($item.Name)+'\s*<current_option>)'+$item.Before+'(</current_option>)'
            if([regex]::Matches($profile,$pattern).Count -ne 1){throw ('CFM_FEATURE_MATCH_COUNT_WRONG='+$item.Name)}
            $profile=[regex]::Replace($profile,$pattern,'${1}'+$item.After+'${2}')
          }
          [xml]$checkedProfile=$profile
          $cfg=[IO.Path]::ChangeExtension($cfg,'.cfm')
          [IO.File]::WriteAllText($cfg,$profile,(New-Object System.Text.UTF8Encoding $false))
          Write-Host ('HP_EXTERNAL_CFM_CREATED='+$cfg+' SHA256='+(Get-FileHash $cfg -Algorithm SHA256).Hash)
          $p=Start-Process $exe -PassThru
          Start-Sleep -Seconds 3
          $code=@'
            using System;using System.Runtime.InteropServices;
            public static class HPClick {
              [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessage(IntPtr handle,uint msg,IntPtr w,IntPtr l);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr handle);
              [DllImport("user32.dll",CharSet=CharSet.Unicode,SetLastError=true)] public static extern bool SetWindowText(IntPtr handle,string text);
              [DllImport("user32.dll",SetLastError=true)] public static extern bool PostMessage(IntPtr handle,uint msg,IntPtr w,IntPtr l);
              [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr GetDlgItem(IntPtr handle,int id);
              [DllImport("user32.dll",CharSet=CharSet.Unicode,SetLastError=true)] public static extern IntPtr FindWindowEx(IntPtr parent,IntPtr after,string cls,string name);
            }
          '@
          Add-Type -TypeDefinition $code
          $winCondition=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id)
          function Dump-UI([string]$label){
            $ws=[Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children,$winCondition)
            Write-Host ("== "+$label+" windows="+$ws.Count)
            foreach($w in $ws){
              $q=New-Object System.Collections.Queue;$q.Enqueue([pscustomobject]@{e=$w;d=0})
              for($i=0;$q.Count -gt 0 -and $i -lt 155;$i++){
                $item=$q.Dequeue();$e=$item.e
                $name=$e.Current.Name;if($name.Length -gt 220){$name=$name.Substring(0,220)}
                Write-Host (('  '*$item.d)+'UI '+$e.Current.ControlType.ProgrammaticName+' NAME='+$name+' ID='+$e.Current.AutomationId+' HANDLE='+$e.Current.NativeWindowHandle)
                if($item.d -le 3){
                  $children=$e.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition)
                  foreach($ch in $children){$q.Enqueue([pscustomobject]@{e=$ch;d=$item.d+1})}
                }
              }
            }
            return $ws
          }
          $wins=Dump-UI 'INITIAL'
          if($wins.Count -eq 0){throw 'NO_HP_WINDOW'}
          $w=$wins[0]
          $okId=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::AutomationIdProperty,'1')
          $ok=$w.FindFirst([Windows.Automation.TreeScope]::Descendants,$okId)
          if(-not $ok){throw 'HP_NOTICE_OK_NOT_FOUND'}
          $invokeObj=$null
          if($ok.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern,[ref]$invokeObj)){
            ([Windows.Automation.InvokePattern]$invokeObj).Invoke()
            Write-Host 'NOTICE_OK_UIA_INVOKED'
          }else{
            [void][HPClick]::SendMessage([IntPtr]$ok.Current.NativeWindowHandle,0xF5,[IntPtr]::Zero,[IntPtr]::Zero)
            Write-Host 'NOTICE_OK_WIN32_CLICK'
          }
          Start-Sleep -Seconds 2
          $wins=Dump-UI 'NOTICE_DISMISSED'
          [void][HPClick]::SetForegroundWindow([IntPtr]$wins[0].Current.NativeWindowHandle)
          $menuCondition=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty,'File')
          $fileMenu=$wins[0].FindFirst([Windows.Automation.TreeScope]::Descendants,$menuCondition)
          if(-not $fileMenu){throw 'HP_DCU_FILE_MENU_NOT_FOUND'}
          $pat=$null
          if($fileMenu.TryGetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern,[ref]$pat)) {
            ([Windows.Automation.ExpandCollapsePattern]$pat).Expand();Write-Host 'FILE_MENU_EXPANDED'
          } elseif($fileMenu.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern,[ref]$pat)) {
            ([Windows.Automation.InvokePattern]$pat).Invoke();Write-Host 'FILE_MENU_INVOKED'
          }else{
            [System.Windows.Forms.SendKeys]::SendWait('%f')
            Write-Host 'FILE_MENU_ALT_F'
          }
          Start-Sleep -Seconds 2
          $wins=Dump-UI 'AFTER_FILE_MENU'
          $openCondition=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty,'Open')
          $openItem=$wins[0].FindFirst([Windows.Automation.TreeScope]::Descendants,$openCondition)
          if(-not $openItem){throw 'HP_DCU_OPEN_MENU_ITEM_NOT_FOUND'}
          $openPat=$null
          if(-not $openItem.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern,[ref]$openPat)){throw 'HP_DCU_OPEN_ITEM_UNINVOKABLE'}
          ([Windows.Automation.InvokePattern]$openPat).Invoke()
          Write-Host 'HP_DCU_OPEN_FILE_INVOKED'
          Start-Sleep -Seconds 2
          $wins=Dump-UI 'AFTER_OPEN_DIALOG'
          $dialogCondition=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty,'Open Configuration File')
          $dialog=$wins[0].FindFirst([Windows.Automation.TreeScope]::Descendants,$dialogCondition)
          if(-not $dialog){throw 'DCU_CONFIG_OPEN_DIALOG_MISSING'}
          $editCondition=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Edit)
          $edit=$dialog.FindFirst([Windows.Automation.TreeScope]::Descendants,$editCondition)
          if(-not $edit){throw 'DCU_CONFIG_FILE_EDIT_MISSING'}
          $allEdits=$dialog.FindAll([Windows.Automation.TreeScope]::Descendants,$editCondition)
          foreach($candidate in $allEdits){Write-Host ('DCU_EDIT_CANDIDATE name='+$candidate.Current.Name+' id='+$candidate.Current.AutomationId+' hwnd='+$candidate.Current.NativeWindowHandle)}
          Write-Host ('DCU_DIALOG_NATIVE='+$dialog.Current.NativeWindowHandle)
          $fg=[HPClick]::SetForegroundWindow([IntPtr]$dialog.Current.NativeWindowHandle)
          Write-Host ('DCU_FILE_DIALOG_FOREGROUND='+$fg)
          # Common File Dialog filename accelerator: Alt+N, select current filename, type the absolute OEM cfg path.
          [System.Windows.Forms.SendKeys]::SendWait('%n')
          Start-Sleep -Milliseconds 250
          [System.Windows.Forms.SendKeys]::SendWait('^a')
          [System.Windows.Forms.SendKeys]::SendWait($cfg)
          Start-Sleep -Milliseconds 300
          Write-Host ('HP_DCU_CFG_TYPIST='+$cfg)
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Write-Host 'HP_DCU_OEM_CFG_LOAD_REQUESTED'
          Start-Sleep -Seconds 4
          $wins=Dump-UI 'AFTER_CFG_LOADED'
          $deviceTabCond=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty,'Device Settings')
          $deviceTab=$wins[0].FindFirst([Windows.Automation.TreeScope]::Descendants,$deviceTabCond)
          if(-not $deviceTab){throw 'HP_DCU_DEVICE_SETTINGS_TAB_MISSING'}
          $selPat=$null
          if(-not $deviceTab.TryGetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern,[ref]$selPat)){throw 'HP_DCU_DEVICE_TAB_SELECTION_PATTERN_MISSING'}
          ([Windows.Automation.SelectionItemPattern]$selPat).Select()
          Write-Host 'HP_DCU_DEVICE_TAB_SELECTED'
          Start-Sleep -Seconds 2
          $wins=Dump-UI 'DEVICE_SETTINGS_TAB'
          $treeItemCond=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty,'Device Type:')
          $treeItem=$wins[0].FindFirst([Windows.Automation.TreeScope]::Descendants,$treeItemCond)
          if(-not $treeItem){throw 'HP_DCU_DEVICE_TYPE_TREE_MISSING'}
          $selObj=$null
          if($treeItem.TryGetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern,[ref]$selObj)){
             ([Windows.Automation.SelectionItemPattern]$selObj).Select()
             Write-Host 'HP_DCU_DEVICE_TYPE_TREE_SELECTED'
          } else {
             $treeItem.SetFocus()
             Write-Host 'HP_DCU_DEVICE_TYPE_TREE_FOCUSED'
          }
          Start-Sleep -Seconds 2
          $wins=Dump-UI 'DEVICE_TYPE_CONTROL'
          $idCond=New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::AutomationIdProperty,'20001')
          $valueBox=$wins[0].FindFirst([Windows.Automation.TreeScope]::Descendants,$idCond)
          if(-not $valueBox){throw 'HP_DCU_DEVICE_TYPE_COMBO_MISSING'}
          $expandPat=$null
          if(-not $valueBox.TryGetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern,[ref]$expandPat)){throw 'HP_DCU_DEVICE_COMBO_NOT_EXPANDABLE'}
          ([Windows.Automation.ExpandCollapsePattern]$expandPat).Expand()
          Write-Host 'HP_DCU_DEVICE_TYPE_COMBO_EXPANDED'
          Start-Sleep -Seconds 1
          $wins=Dump-UI 'DEVICE_TYPE_OPTIONS'
          try {
            Add-Type -AssemblyName System.Drawing
            $box=$wins[0].Current.BoundingRectangle
            $left=[int]$box.Left;$top=[int]$box.Top
            $width=[Math]::Min(1050,[Math]::Max(1,[int]$box.Width))
            $height=[Math]::Min(820,[Math]::Max(1,[int]$box.Height))
            $bitmap=New-Object System.Drawing.Bitmap($width,$height)
            $canvas=[Drawing.Graphics]::FromImage($bitmap)
            try{$canvas.CopyFromScreen($left,$top,0,0,$bitmap.Size)}finally{$canvas.Dispose()}
            $memory=New-Object IO.MemoryStream
            $codec=[Drawing.Imaging.ImageCodecInfo]::GetImageEncoders()|Where-Object MimeType -eq 'image/jpeg'|Select-Object -First 1
            $params=New-Object Drawing.Imaging.EncoderParameters 1
            $params.Param[0]=New-Object Drawing.Imaging.EncoderParameter([Drawing.Imaging.Encoder]::Quality,[long]33)
            $bitmap.Save($memory,$codec,$params)
            $bitmap.Dispose()
            Write-Host ('DCU_SCREENSHOT_JPEG_BASE64='+[Convert]::ToBase64String($memory.ToArray()))
            $memory.Dispose()
          }catch{Write-Host ('DCU_SCREENSHOT_NOT_AVAILABLE='+$_.Exception.Message)}

          $cbSource=@'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class HPComboNative {
              [DllImport("user32.dll",EntryPoint="SendMessageW",CharSet=CharSet.Unicode)]
              public static extern int GetCount(IntPtr hwnd,uint msg,IntPtr wParam,IntPtr lParam);
              [DllImport("user32.dll",EntryPoint="SendMessageW",CharSet=CharSet.Unicode)]
              public static extern int GetText(IntPtr hwnd,uint msg,IntPtr index,StringBuilder output);
              [DllImport("user32.dll",EntryPoint="SendMessageW",CharSet=CharSet.Unicode)]
              public static extern int SetIndex(IntPtr hwnd,uint msg,IntPtr index,IntPtr unused);
          }
          '@
          Add-Type -TypeDefinition $cbSource -ErrorAction Stop
          $cbHwnd=[IntPtr]$valueBox.Current.NativeWindowHandle
          $infoType=@'
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Sequential)]
          public struct HPRECT {public int left;public int top;public int right;public int bottom;}
          [StructLayout(LayoutKind.Sequential)]
          public struct HPCOMBOBOXINFO {
             public int cbSize;public HPRECT rcItem;public HPRECT rcButton;public int stateButton;
             public IntPtr hwndCombo;public IntPtr hwndItem;public IntPtr hwndList;
          }
          public static class HPComboInfo {
             [DllImport("user32.dll",SetLastError=true)]
             public static extern bool GetComboBoxInfo(IntPtr handle,ref HPCOMBOBOXINFO info);
             [DllImport("user32.dll",EntryPoint="SendMessageW",CharSet=CharSet.Unicode)]
             public static extern int SendCount(IntPtr hwnd,uint msg,IntPtr wParam,IntPtr lParam);
             [DllImport("user32.dll",EntryPoint="SendMessageW",CharSet=CharSet.Unicode)]
             public static extern int GetListText(IntPtr hwnd,uint msg,IntPtr item,System.Text.StringBuilder output);
          }
          '@
          Add-Type -TypeDefinition $infoType -ErrorAction Stop
          $ci=New-Object HPCOMBOBOXINFO
          $ci.cbSize=[Runtime.InteropServices.Marshal]::SizeOf([type][HPCOMBOBOXINFO])
          $canInfo=[HPComboInfo]::GetComboBoxInfo($cbHwnd,[ref]$ci)
          Write-Host ('HP_DCU_COMBO_INFO='+$canInfo+' dropdown='+$ci.hwndList+' item='+$ci.hwndItem)
          if($canInfo -and $ci.hwndList -ne [IntPtr]::Zero) {
             $lc=[HPComboInfo]::SendCount($ci.hwndList,0x18B,[IntPtr]::Zero,[IntPtr]::Zero)
             Write-Host ('HP_DCU_NATIVE_LIST_COUNT='+$lc)
             for($idx=0; $idx -lt $lc -and $idx -lt 30; $idx++){
               $str=New-Object Text.StringBuilder 256
               $length=[HPComboInfo]::GetListText($ci.hwndList,0x189,[IntPtr]$idx,$str)
               Write-Host ('HP_DCU_NATIVE_LIST_ITEM_'+$idx+'='+$str.ToString()+' LEN='+$length)
             }
          }
          $cbCount=[HPComboNative]::GetCount($cbHwnd,0x146,[IntPtr]::Zero,[IntPtr]::Zero)
          $cbSelected=[HPComboNative]::GetCount($cbHwnd,0x147,[IntPtr]::Zero,[IntPtr]::Zero)
          Write-Host ("HP_DCU_NATIVE_COMBO_HWND="+$cbHwnd+" COUNT="+$cbCount+" SELECTED="+$cbSelected)
          $colorIndex=-1
          if($cbCount -gt 0 -and $cbCount -le 32){
            for($i=0;$i -lt $cbCount;$i++){
              $buff=New-Object Text.StringBuilder 256
              $n=[HPComboNative]::GetText($cbHwnd,0x148,[IntPtr]$i,$buff)
              $v=$buff.ToString()
              Write-Host ("HP_DCU_COMBO_OPTION_"+$i+"="+$v+" LEN="+$n)
              if($v -eq 'Color'){$colorIndex=$i}
            }
          }
          if($colorIndex -ge 0){
            $new=[HPComboNative]::SetIndex($cbHwnd,0x14E,[IntPtr]$colorIndex,[IntPtr]::Zero)
            Write-Host ("HP_DCU_NATIVE_COLOR_SET_INDEX="+$new)
          }
          $options=$valueBox.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
          Write-Host ('HP_DCU_COLOR_OPTIONS_COUNT='+$options.Count)
          foreach($el in $options) {
            $label=$el.Current.Name
            if($label.Length -gt 70){$label=$label.Substring(0,70)}
            Write-Host ('HP_DCU_COLOR_OPTION '+$el.Current.ControlType.ProgrammaticName+' '+$label)
          }
          $colorEl=$null
          foreach($el in $options) {
             if($el.Current.Name -eq 'Color' -and $el.Current.ControlType -eq [Windows.Automation.ControlType]::ListItem){$colorEl=$el;break}
          }
          if($colorEl) {
             $sp=$null
             if(-not $colorEl.TryGetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern,[ref]$sp)){throw 'HP_DCU_COLOR_OPTION_UNSELECTABLE'}
             ([Windows.Automation.SelectionItemPattern]$sp).Select()
             Write-Host 'HP_DCU_COLOR_SELECTED_VIA_UIA'
          }else{
             $valueBox.SetFocus()
             [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
             [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
             Write-Host 'HP_DCU_COLOR_SELECTED_VIA_KEYBOARD'
          }
          Start-Sleep -Seconds 1
          Write-Host ('HP_DCU_COLOR_COMBO_AFTER='+$valueBox.Current.Name)
          $wins=Dump-UI 'AFTER_COLOR_SELECTION'
          $desk=[Windows.Automation.AutomationElement]::RootElement
          $popups=$desk.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition)
          foreach($popup in $popups){
            if($popup.Current.ProcessId -eq $p.Id){Write-Host ('TOPPOPUP '+$popup.Current.ControlType.ProgrammaticName+' '+$popup.Current.Name)}
          }
          Write-Host ('OEM_CFG_FOR_OPEN='+$cfg)
          Write-Host 'DCU_GUI_OPEN_PROBE_COMPLETE'
          try{Stop-Process $p.Id -Force -ErrorAction SilentlyContinue}catch{}
