name: NinjaOne HP color v1.3 central immutable raw SHA256
on:
  push:
    branches:
      - fix/hp-upd-color-capability-idempotent-20261113
    paths:
      - .github/workflows/hp-color-v13-raw-pin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hash:
    runs-on: windows-2025
    timeout-minutes: 4
    steps:
      - name: Download immutable HP color central script and verify Windows PowerShell parser
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $commit='196de429fd7ebf0b58909839711077f3d179c0e5'
          $url='https://raw.githubusercontent.com/BewustRon/BewustICT-Printer-Deployment/'+$commit+'/scripts/Deploy-BewustICTPrinter.ps1'
          $dest=Join-Path $env:RUNNER_TEMP 'HP-color-1.3.0-raw.ps1'
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing -TimeoutSec 80
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($dest,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object {Write-Host $_};throw 'CENTRAL_PS51_PARSER_FAILED'}
          Write-Host ('CENTRAL_HP_COLOR_COMMIT='+$commit)
          Write-Host ('CENTRAL_HP_COLOR_RAW_SHA256='+(Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash)
          Write-Host 'CENTRAL_HP_COLOR_PIN_VERIFIED'
