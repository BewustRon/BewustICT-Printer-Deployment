name: Epson UPD - INF layout and built-in extraction test
on:
  push:
    paths:
      - '.github/workflows/epson-driver-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate signed official Epson v2.122 installer, test tar, inspect driver names
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://ftp.epson.com/drivers/EUPD_x64_212200.exe'
          $expectedHash = '3CC1C313ADFAB74F957E2AF63FF2FA87279169E3A043365EB0AF6024D420663B'
          $file = Join-Path $env:RUNNER_TEMP 'EUPD_x64_212200.exe'
          Invoke-WebRequest -Uri $url -UseBasicParsing -OutFile $file -TimeoutSec 300
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
          Write-Host "HASH=$hash"
          if ($hash -ne $expectedHash) { throw 'EPSON_HASH_MISMATCH' }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          Write-Host ('SIGNATURE_STATUS=' + $sig.Status)
          Write-Host ('SIGNER=' + $sig.SignerCertificate.Subject)
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'SEIKO EPSON') {
            throw 'EPSON_SIGNATURE_INVALID'
          }
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          $method = & $seven l -slt $file 2>&1
          $method | Select-String -Pattern '^Type =|^Method =|^Physical Size =' | Select-Object -First 12 | ForEach-Object { Write-Host ('ARCHIVE=' + $_.Line) }
          $tar = (Get-Command tar.exe -ErrorAction SilentlyContinue).Source
          $dst = Join-Path $env:RUNNER_TEMP 'EpsonExtract'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          if ($tar) {
            $tarOutput = & $tar -tf $file 2>&1
            $tarStatus = $LASTEXITCODE
            Write-Host "TAR_SFX_LIST_EXITCODE=$tarStatus"
            if ($tarStatus -eq 0) {
              & $tar -xf $file -C $dst 2>&1 | Select-Object -First 12 | ForEach-Object { Write-Host $_ }
              $tarExtractStatus = $LASTEXITCODE
              Write-Host "TAR_SFX_EXTRACT_EXITCODE=$tarExtractStatus"
            }
          }
          $inf = @(Get-ChildItem -Path $dst -Filter '*.inf' -Recurse -File -ErrorAction SilentlyContinue)
          if ($inf.Count -eq 0) {
            & $seven x $file "-o$dst" '-y' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'EPSON_7ZIP_EXTRACT_FAILED' }
            $inf = @(Get-ChildItem -Path $dst -Filter '*.inf' -Recurse -File)
          }
          Write-Host ('INF_COUNT=' + $inf.Count)
          foreach ($item in $inf) {
            Write-Host ('INF_FILE=' + $item.FullName)
            $cat = @(Get-ChildItem -Path $item.DirectoryName -Filter '*.cat' -File)
            foreach ($c in $cat) {
              $catSig = Get-AuthenticodeSignature -LiteralPath $c.FullName
              Write-Host ('CAT_FILE=' + $c.Name + ';STATUS=' + $catSig.Status + ';SUBJECT=' + $catSig.SignerCertificate.Subject)
              if ($catSig.Status -ne 'Valid') { throw 'EPSON_CAT_INVALID' }
            }
            Get-Content -LiteralPath $item.FullName | Select-String -Pattern 'Universal|^(\s*\[Strings|\s*\[Manufacturer)|PCL6|ESC/P-R' |
              Select-Object -First 90 | ForEach-Object { Write-Host ('DRIVER_INF_LINE=' + $_.Line.Trim()) }
          }
          Write-Host 'INSPECT_FINISHED: no software installed, no vendor binaries published.'
