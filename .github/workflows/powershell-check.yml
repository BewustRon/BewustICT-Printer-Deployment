name: Windows PowerShell parser
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/powershell-check.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/powershell-check.yml'
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Deploy-BewustICTPrinter.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
          Write-Host 'OK: Windows PowerShell 5.1 syntax gecontroleerd'
