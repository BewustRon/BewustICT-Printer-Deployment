name: Windows PowerShell parser
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/powershell-check.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/powershell-check.yml'
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer alle PowerShell scripts op syntaxfouten
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path 'scripts' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "Parserfout in $($_.Name)"
            }
            Write-Host "SYNTAX_OK: $($_.Name)"
          }
