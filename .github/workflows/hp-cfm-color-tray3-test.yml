name: HP OEM CFM profile silent offline Tray3 Color queue pilot
on:
  push:
    branches:
      - fix/hp-upd-offline-color-duplex-tray3-20261112
    paths:
      - .github/workflows/hp-cfm-color-tray3-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cfm-tray3:
    runs-on: windows-2025
    timeout-minutes: 13
    steps:
      - name: Create OEM XML CFM sidecar and install signed HP UPD silently without reachable printer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $root=Join-Path $env:RUNNER_TEMP 'HP-UPD-CFM-ColorTray3'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip=Join-Path $root 'official.zip'
          & "$env:WINDIR\System32\curl.exe" --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --output $zip 'https://ftp.hp.com/pub/softlib/software13/printers/UPD/upd-pcl6-win11-x64-8.2.0.26819.zip'
          if($LASTEXITCODE -ne 0){throw 'DOWNLOAD_FAILED'}
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'EDBACBBB0124FF5EF320C4023D7B540C8435263B37BA06812AB63DA2919534A2'){throw 'HASH_MISMATCH'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extract=Join-Path $root 'driver'
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$extract)
          $cfg=Join-Path $extract 'hpcpu360.cfg'
          $cfm=Join-Path $extract 'hpcpu360.cfm'
          $install=Join-Path $extract 'install.exe'
          $cat=Join-Path $extract 'hpcu360u.cat'
          foreach($p in @($cfg,$install,$cat)){if(-not (Test-Path $p)){throw "OEM_FILE_NOT_FOUND $p"}}
          $exeSignature=Get-AuthenticodeSignature -LiteralPath $install
          $catSignature=Get-AuthenticodeSignature -LiteralPath $cat
          Write-Host "INSTALLER_SIG=$($exeSignature.Status); SIGNER=$($exeSignature.SignerCertificate.Subject)"
          Write-Host "CAT_SIG=$($catSignature.Status); SIGNER=$($catSignature.SignerCertificate.Subject)"
          if($exeSignature.Status -ne 'Valid' -or $catSignature.Status -ne 'Valid'){throw 'OEM_SIGNING_INVALID'}
          if($catSignature.SignerCertificate.Thumbprint -ne 'BE845AAF486FD9F15D2C71BEED66E8AE21429EEA'){throw 'OEM_CAT_SIGNER_MISMATCH'}
          # Test on a disposable CI runner only: same approved leaf certificate as deployment catalog.
          $store=New-Object Security.Cryptography.X509Certificates.X509Store('TrustedPublisher','LocalMachine')
          $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          try{$store.Add($catSignature.SignerCertificate)}finally{$store.Close()}
          $config=[IO.File]::ReadAllText($cfg)
          $options=@(
            @{key='Tray3_install';old='NotInstalled';new='Installed'},
            @{key='DynamicRender';old='AUTODEVICE';new='COLORDEVICE'}
          )
          foreach($opt in $options){
            $regex='(?s)(<feature\s+[^>]*>\s*'+[regex]::Escape($opt.key)+'\s*<current_option>)'+$opt.old+'(</current_option>)'
            $all=[regex]::Matches($config,$regex)
            Write-Host ("PROFILE_KEY="+$opt.key+" MATCHES="+$all.Count)
            if($all.Count -ne 1){throw "NON_UNIQUE_HP_CFG_FEATURE_$($opt.key)"}
            $config=[regex]::Replace($config,$regex,'$1'+$opt.new+'$2',1)
          }
          [xml]$parsed=$config
          [IO.File]::WriteAllText($cfm,$config,[Text.Encoding]::UTF8)
          Write-Host ('CFM_SHA256='+(Get-FileHash $cfm -Algorithm SHA256).Hash)
          Write-Host ('CFG_ORIGINAL_SHA256='+(Get-FileHash $cfg -Algorithm SHA256).Hash)
          $printer='BIC HP CI CFM Color Tray3'
          $arguments='/q /h /npf /sm192.0.2.50 /n"'+$printer+'" /gcfm"'+$cfm+'"'
          Write-Host ("INSTALLER_ARGS="+$arguments)
          $proc=Start-Process -FilePath $install -ArgumentList $arguments -PassThru -WindowStyle Hidden -ErrorAction Stop
          if(-not $proc.WaitForExit(180000)){
            try{Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}catch{}
            Write-Host 'HP_INSTALLER_TIMEOUT_180_SEC'
          }else{$proc.Refresh();Write-Host ('HP_INSTALLER_EXIT='+$proc.ExitCode)}
          $printerObj=Get-Printer -Name $printer -ErrorAction SilentlyContinue
          if(-not $printerObj){
            Write-Host 'NO_HP_QUEUE_AFTER_CFM'
            Get-Printer | Where-Object DriverName -match 'HP Universal' | Select-Object Name,DriverName | Format-List | Out-String | Write-Host
            throw 'HP_CFM_DRIVER_QUEUE_NOT_CREATED'
          }
          Write-Host ('QUEUE_NAME='+$printerObj.Name+' DRIVER='+$printerObj.DriverName)
          Add-Type -AssemblyName System.Drawing
          $settings=New-Object System.Drawing.Printing.PrinterSettings
          $settings.PrinterName=$printer
          Write-Host ('SUPPORTS_COLOR='+$settings.SupportsColor+' DUPLEX='+$settings.CanDuplex)
          foreach($source in @($settings.PaperSources)){if($source.SourceName -match '(?i)tray|lade|cassette'){Write-Host ('SOURCE='+$source.SourceName+' RAW='+$source.RawKind)}}
          $tray3=@($settings.PaperSources | Where-Object {$_.SourceName -match '(?i)(?:tray|lade|cassette)\s*3(?:\s|$)'})
          if($tray3.Count -ne 1){throw "HP_CFM_TRAY3_NOT_ADVERTISED count=$($tray3.Count)"}
          if(-not $settings.SupportsColor){throw 'HP_CFM_DEVICE_COLOR_CAPABILITY_MISSING'}
          Write-Host 'HP_CFM_COLOR_TRAY3_OFFLINE_VERIFIED'
